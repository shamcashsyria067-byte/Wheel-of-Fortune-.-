<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة الحظ التفاعلية</title>
<style>
  body { font-family: Tahoma, sans-serif; background-color: #0d1b2a; color: #fff; text-align: center; margin: 0; padding: 20px; }
  .wheel-container { position: relative; width: 300px; height: 300px; margin: 20px auto; }
  #wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #ffd700; position: relative; overflow: hidden; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(#ff6b6b 0deg 60deg, #feca57 60deg 120deg, #48dbfb 60deg 180deg, #ff9ff3 180deg 240deg, #54a0ff 240deg 300deg, #1dd1a1 300deg 360deg); }
  .pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 30px solid #ff4757; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
  input, button { padding: 12px; font-size: 16px; margin: 10px; border-radius: 8px; border: none; width: 80%; max-width: 300px; }
  button { background-color: #ffd700; color: #0d1b2a; font-weight: bold; cursor: pointer; }
  button:hover { background-color: #ffc107; }
  #result { font-size: 20px; margin-top: 20px; font-weight: bold; color: #ffd700; }
</style>
</head>
<body>

  <h2>عجلة الحظ اليومية</h2>
  <p>أدخل رقم هاتفك ثم اضغط لف العجلة واربح معنا!</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div id="wheel"></div>
  </div>

  <input type="text" id="phone" placeholder="أدخل رقم هاتفك مع رمز الدولة">
  <br>
  <button id="spinBtn">لف العجلة</button>
  
  <div id="result"></div>

<script>
  const prizes = ["رحلة عمرة", "سيارة", "حظ أوفر", "1000 دولار", "آيفون 15", "جائزة أخرى"];
  const wheel = document.getElementById("wheel");
  const spinBtn = document.getElementById("spinBtn");
  const phoneInput = document.getElementById("phone");
  const resultDiv = document.getElementById("result");
  
  let currentRotation = 0;

  spinBtn.onclick = () => {
    const phone = phoneInput.value.trim();
    if (!phone || phone.length < 8) {
      resultDiv.textContent = "الرجاء إدخال رقم هاتف صحيح أولاً!";
      return;
    }

    spinBtn.disabled = true;
    resultDiv.textContent = "جاري لف العجلة...";

    // اختيار جائزة عشوائية وتدوير العجلة
    const randomChoice = Math.floor(Math.random() * prizes.length);
    const degreesPerPrize = 360 / prizes.length;
    
    // عدد دورات كاملة (5 دورات) + زاوية الجائزة
    const extraSpans = 360 * 5;
    const targetDegree = extraSpans + (randomChoice * degreesPerPrize) + (degreesPerPrize / 2);
    
    currentRotation += targetDegree;
    wheel.style.transform = `rotate(-${currentRotation}deg)`;

    setTimeout(() => {
      resultDiv.textContent = `مبروك! لقد ربحت معنا: ${prizes[randomChoice]} 🎉`;
      spinBtn.disabled = false;
    }, 4000);
  };
</script>

</body>
</html>
