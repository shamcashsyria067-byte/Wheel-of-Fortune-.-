<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة الحظ اليومية</title>
<style>
  * { box-sizing: border-box; }
  body {
    background-color: #0b132b;
    color: #ffffff;
    font-family: Tahoma, sans-serif;
    text-align: center;
    margin: 0;
    padding: 15px;
  }
  
  #game-page { display: block; }
  h2 { margin-bottom: 5px; color: #ffd700; }
  p { font-size: 14px; color: #cbd5e1; margin-top: 0; }
  
  .wheel-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 15px auto;
  }
  .pointer {
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 25px solid #ff4757;
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  #wheelCanvas {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 6px solid #ffd700;
    transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
  }
  .input-field {
    width: 90%;
    max-width: 300px;
    padding: 12px;
    margin: 8px auto;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    text-align: center;
    display: block;
    outline: none;
    background: #ffffff;
    color: #000000;
  }
  #spinBtn {
    width: 90%;
    max-width: 300px;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    background-color: #ffd700;
    color: #0b132b;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
  }
  #spinBtn:disabled { background-color: #64748b; cursor: not-allowed; }
  #error-msg { font-size: 15px; margin-top: 10px; color: #ff4757; font-weight: bold; }
