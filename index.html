<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المحفظة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1c24;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        /* الشريط العلوي */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .currency-switch {
            background-color: #252836;
            border-radius: 20px;
            display: flex;
            padding: 3px;
            width: 140px;
        }
        .currency-btn {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 13px;
            border-radius: 17px;
            cursor: pointer;
            color: #8b92a5;
        }
        .currency-btn.active {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        .top-icons {
            display: flex;
            gap: 10px;
        }
        .icon-btn {
            background-color: #252836;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
        }

        /* بطاقة الرصيد */
        .balance-card {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 14px;
            color: #bfdbfe;
            margin-bottom: 8px;
        }
        .balance-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .pending-balance {
            font-size: 13px;
            color: #bfdbfe;
        }

        /* أزرار إرسال واستلام */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .action-btn {
            flex: 1;
            background-color: #252836;
            border: 1px solid #32374a;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: bold;
        }
        .action-btn span {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .action-btn:hover {
            background-color: #2f3346;
        }

        /* خدمات التطبيق الدائرية */
        .services-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .service-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .service-icon {
            width: 50px;
            height: 50px;
            background-color: #252836;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-bottom: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .service-name {
            font-size: 12px;
            color: #8b92a5;
        }

        /* قسم آخر التحويلات */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .tx-card {
            background-color: #252836;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #32374a;
        }
        .tx-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tx-icon {
            width: 42px;
            height: 42px;
            background-color: rgba(46, 204, 113, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #2ecc71;
        }
        .tx-details {
            display: flex;
            flex-direction: column;
        }
        .tx-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .tx-date {
            font-size: 12px;
            color: #8b92a5;
        }
        .tx-amount {
            font-size: 16px;
            font-weight: bold;
            color: #2ecc71;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشريط العلوي -->
        <div class="top-nav">
            <div class="currency-switch">
                <div class="currency-btn">دولار</div>
                <div class="currency-btn active">ليرة</div>
            </div>
            <div class="top-icons">
                <div class="icon-btn">🔔</div>
                <div class="icon-btn">⚙️</div>
            </div>
        </div>

        <!-- بطاقة الرصيد -->
        <div class="balance-card">
            <div class="balance-label">إجمالي الرصيد</div>
            <div class="balance-value">USD 13,000</div>
            <div class="pending-balance">0 رصيد معلَّق</div>
        </div>

        <!-- أزرار إرسال واستلام -->
        <div class="action-buttons">
            <button class="action-btn" onclick="alert('إرسال أموال')">
                <span>📤</span> إرسال
            </button>
            <button class="action-btn" onclick="alert('استقبال أموال')">
                <span>📥</span> استقبال
            </button>
        </div>

        <!-- الخدمات السريعة الدائرية -->
        <div class="services-grid">
            <div class="service-item" onclick="alert('بنوك')">
                <div class="service-icon">🏦</div>
                <div class="service-name">بنوك</div>
            </div>
            <div class="service-item" onclick="alert('فواتير')">
                <div class="service-icon">📄</div>
                <div class="service-name">فواتير</div>
            </div>
            <div class="service-item" onclick="alert('مدفوعات')">
                <div class="service-icon">💳</div>
                <div class="service-name">مدفوعات</div>
            </div>
            <div class="service-item" onclick="alert('حوالات')">
                <div class="service-icon">🔁</div>
                <div class="service-name">حوالات</div>
            </div>
            <div class="service-item" onclick="alert('خدماتي')">
                <div class="service-icon">⭐</div>
                <div class="service-name">خدماتي</div>
            </div>
        </div>

        <!-- آخر التحويلات -->
        <div class="section-title">آخر التحويلات</div>
        
        <div class="tx-card">
            <div class="tx-info">
                <div class="tx-icon">📥</div>
                <div class="tx-details">
                    <span class="tx-name">مركز الحوالات الخارجية</span>
                    <span class="tx-date">اليوم</span>
                </div>
            </div>
            <div class="tx-amount">+ 13,000 USD</div>
        </div>
    </div>

</body>
</html>
