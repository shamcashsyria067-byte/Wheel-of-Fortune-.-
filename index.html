<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة الحظ اليومية</title>
<style>
  * { box-sizing: border-box; }
  body {
    background-color: #0b132b;
    color: #ffffff;
    font-family: Tahoma, sans-serif;
    text-align: center;
    margin: 0;
    padding: 15px;
  }
  
  #game-page { display: block; }
  h2 { margin-bottom: 5px; color: #ffd700; }
  p { font-size: 14px; color: #cbd5e1; margin-top: 0; }
  
  .wheel-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 15px auto;
  }
  .pointer {
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 25px solid #ff4757;
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  #wheelCanvas {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    border: 6px solid #ffd700;
    transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
  }
  .input-field {
    width: 90%;
    max-width: 300px;
    padding: 12px;
    margin: 8px auto;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    text-align: center;
    display: block;
    outline: none;
    background: #ffffff;
    color: #000000;
  }
  #spinBtn {
    width: 90%;
    max-width: 300px;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    background-color: #ffd700;
    color: #0b132b;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
  }
  #spinBtn:disabled { background-color: #64748b; cursor: not-allowed; }
  #error-msg { font-size: 15px; margin-top: 10px; color: #ff4757; font-weight: bold; }

  #claim-page {
    display: none;
    max-width: 400px;
    margin: 20px auto;
    background: #1c2541;
    padding: 25px;
    border-radius: 16px;
    border: 2px solid #ffd700;
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
  }
  .congrats-title { font-size: 24px; color: #ffd700; margin-bottom: 10px; }
  .prize-card {
    background: #0b132b;
    padding: 15px;
    border-radius: 10px;
    margin: 15px 0;
    border: 1px dashed #ffd700;
  }
  .prize-name { font-size: 22px; color: #4ade80; font-weight: bold; margin: 8px 0; }
  .user-info { font-size: 14px; color: #e2e8f0; margin: 5px 0; text-align: right; }
  .instruction-box {
    background: #ff4757;
    color: #ffffff;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    margin-top: 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="game-page">
    <h2>عجلة الحظ اليومية 🎁</h2>
    <p>أدخل اسمك ورقم هاتفك (مسموح محاولتان كل يوم)!</p>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="280" height="280"></canvas>
    </div>

    <input type="text" id="username" class="input-field" placeholder="أدخل الاسم الكامل">
    <input type="tel" id="phone" class="input-field" placeholder="أدخل رقم الهاتف مع رمز الدولة">
    <button id="spinBtn">لَف العجلة</button>

    <div id="error-msg"></div>
  </div>

  <div id="claim-page">
    <div class="congrats-title">🎉 ألف مبروك الفوز! 🎉</div>
    <p>لقد ربحت معنا جائزة قيمة، يرجى حفظ هذه الصفحة لاستلام الجائزة.</p>

    <div class="prize-card">
      <div>الجائزة التي ربحتها هي:</div>
      <div id="claimedPrize" class="prize-name">---</div>
      <div class="user-info">الاسم: <span id="display-name"></span></div>
      <div class="user-info">الهاتف: <span id="display-phone"></span></div>
    </div>

    <div class="instruction-box">
      الرجاء أخذ لقطة شاشة (Screenshot) لهذه الصفحة والتواصل مع خدمة العملاء لاستلام جائزتك!
    </div>
  </div>

<script>
  const prizes = [
    { name: "هاتف ذكي 📱", color: "#3a86ef" },
    { name: "بطاقة تسوق 💳", color: "#8338ec" },
    { name: "سماعات لاسلكية 🎧", color: "#ff006e" },
    { name: "حفظ المحاولة 🔁", color: "#fb5607" },
    { name: "ساعة ذكية ⌚", color: "#ffbe0b" },
    { name: "قسيمة خصم 50% 🏷️", color: "#06d6a0" }
  ];

  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const errorMsg = document.getElementById("error-msg");
  
  const numPrizes = prizes.length;
  const arcSize = (2 * Math.PI) / numPrizes;
  let currentRotation = 0;
  let isSpinning = false;

  // رسم عجلة الحظ
  function drawWheel() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = canvas.width / 2;

    for (let i = 0; i < numPrizes; i++) {
      const angle = i * arcSize;
      
      // رسم القطاع
      ctx.beginPath();
      ctx.fillStyle = prizes[i].color;
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
      ctx.lineTo(centerX, centerY);
      ctx.fill();

      // رسم النصوص
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(angle + arcSize / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px Tahoma";
      ctx.fillText(prizes[i].name, radius - 15, 5);
      ctx.restore();
    }
  }

  drawWheel();

  // التحقق من المحاولات اليومية
  function getSpinsToday() {
    const today = new Date().toISOString().split('T')[0];
    const savedData = JSON.parse(localStorage.getItem('wheel_spins') || '{}');
    if (savedData.date !== today) {
      return 0;
    }
    return savedData.count || 0;
  }

  function incrementSpins() {
    const today = new Date().toISOString().split('T')[0];
    const count = getSpinsToday() + 1;
    localStorage.setItem('wheel_spins', JSON.stringify({ date: today, count: count }));
  }

  spinBtn.addEventListener("click", () => {
    const name = document.getElementById("username").value.trim();
    const phone = document.getElementById("phone").value.trim();
    errorMsg.textContent = "";

    if (!name || !phone) {
      errorMsg.textContent = "يرجى إدخال الاسم ورقم الهاتف أولاً!";
      return;
    }

    const spinsToday = getSpinsToday();
    if (spinsToday >= 2) {
      errorMsg.textContent = "لقد استنفدت محاولتيك لهذا اليوم، عد غداً!";
      return;
    }

    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;

    // اختيار جائزة عشوائية
    const winningIndex = Math.floor(Math.random() * numPrizes);
    
    // حساب زاوية الدوران المستهدفة
    const degreesPerSegment = 360 / numPrizes;
    const randomRounds = 5; // عدد الدورات الكاملة
    
    // محاذاة مؤشر السهم (الأعلى)
    const targetDegree = randomRounds * 360 + (360 - (winningIndex * degreesPerSegment + degreesPerSegment / 2)) - 90;
    currentRotation += targetDegree;

    canvas.style.transform = `rotate(${currentRotation}deg)`;

    // تسجيل المحاولة
    incrementSpins();

    setTimeout(() => {
      isSpinning = false;
      
      // عرض صفحة الفوز
      document.getElementById("game-page").style.display = "none";
      document.getElementById("claim-page").style.display = "block";
      
      document.getElementById("claimedPrize").textContent = prizes[winningIndex].name;
      document.getElementById("display-name").textContent = name;
      document.getElementById("display-phone").textContent = phone;

    }, 4000);
  });
</script>

</body>
</html>
